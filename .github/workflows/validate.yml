name: Validate chess

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        backend: [Akka, Orleans]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Install Aspire
        run: dotnet tool install --global Aspire.Cli --version 13.5.3
      - name: Validate PostgreSQL server and event transports
        run: bash scripts/test-server.sh '${{ matrix.backend }}'
      - name: Resume games after switching actor frameworks
        if: matrix.backend == 'Akka'
        run: bash scripts/test-backend-switch.sh
      - name: Package and install the dotnet chess command
        run: |
          dotnet pack clients/Chess.Cli --configuration Release --no-build --output artifacts/packages
          dotnet tool install Chess.Cli --tool-path artifacts/cli-tool --source artifacts/packages
          PATH="$PWD/artifacts/cli-tool:$PATH" dotnet chess help
      - name: Upload CLI package
        uses: actions/upload-artifact@v4
        with:
          name: chess-cli-${{ matrix.backend }}
          path: artifacts/packages/*.nupkg
      - name: Upload server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results-${{ matrix.backend }}
          path: TestResults/

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**'
  external-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/validation/requirements.txt
      - run: bash tests/validation/fetch-references.sh
      - run: dotnet build tools/Chess.Validation --configuration Release
      - name: Compare rules, notation, history, and perft
        run: >-
          python tests/validation/validate.py
          --stockfish artifacts/stockfish/stockfish/stockfish-ubuntu-x86-64
          --corpus artifacts/standard.epd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-validation
          path: artifacts/validation-report.json
